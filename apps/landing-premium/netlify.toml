[build]
  command = "npm install && npm run build -w apps/landing-premium"
  publish = "apps/landing-premium/dist"

[build.environment]
  NODE_VERSION = "20.11.1"
  NPM_FLAGS = "--no-package-lock"
  CI = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

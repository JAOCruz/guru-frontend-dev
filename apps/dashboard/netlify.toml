[build]
  command = "npm install && npm run build -w apps/dashboard"
  publish = "apps/dashboard/dist"

[build.environment]
  NODE_VERSION = "24.22.1"
  NPM_FLAGS = "--no-package-lock"
  CI = "false"

# SPA catch-all: let React Router handle client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
